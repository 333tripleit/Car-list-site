<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Доступные Авто | Авто в наличии на границе Литва-Беларусь</title>
    <link rel="stylesheet" href="/css/styles.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="container header-content">
        <div>
          <p class="eyebrow">Авто в наличии</p>
          <h1>Авто на границе Литва-Беларусь</h1>
        </div>
        <a class="button ghost" href="/admin">Панель администратора</a>
      </div>
    </header>

    <main class="container main-layout">
      <section class="filters" aria-label="Car filters">
        <h2>Filters</h2>
        <form id="filterForm" class="filter-form">
          <label>
            Марка
            <select id="brandFilter" name="brand">
              <option value="">Все марки</option>
            </select>
          </label>

          <label>
            Тип кузова
            <select id="bodyTypeFilter" name="bodyType">
              <option value="">Все типы кузова</option>
            </select>
          </label>

          <label>
            Тип топлива
            <select id="fuelTypeFilter" name="fuelType">
              <option value="">Все</option>
            </select>
          </label>

          <label>
            Минимальные л.с.
            <input type="number" id="horsepowerMinFilter" name="horsepowerMin" min="0" placeholder="пример: 150" />
          </label>

          <label>
            Максимальные л.с.
            <input type="number" id="horsepowerMaxFilter" name="horsepowerMax" min="0" placeholder="пример: 350" />
          </label>

          <label>
            Год выпуска от
            <input type="number" id="yearMinFilter" name="yearMin" min="1980" max="2030" />
          </label>

          <label>
            Год выпуска до
            <input type="number" id="yearMaxFilter" name="yearMax" min="1980" max="2030" />
          </label>

          <button type="reset" class="button secondary">Сбросить фильтры</button>
        </form>
      </section>

      <section class="catalog" aria-live="polite">
        <div class="catalog-header">
          <h2>Доступный каталог</h2>
          <p id="catalogCount">0 машин</p>
        </div>
        <div id="carsGrid" class="cars-grid"></div>
      </section>
    </main>

    <dialog id="carModal" class="car-modal">
      <button class="close-modal" id="closeModalBtn" aria-label="Close details">×</button>
      <div id="modalContent"></div>
    </dialog>

    <script type="module" src="/js/app.js"></script>
  </body>
</html>
