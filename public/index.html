<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Border Cars | Lithuania-Belarus Availability</title>
    <link rel="stylesheet" href="/css/styles.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="container header-content">
        <div>
          <p class="eyebrow">Car availability status</p>
          <h1>Cars on the Lithuania-Belarus border</h1>
        </div>
        <a class="button ghost" href="/admin">Admin panel</a>
      </div>
    </header>

    <main class="container main-layout">
      <section class="filters" aria-label="Car filters">
        <h2>Filters</h2>
        <form id="filterForm" class="filter-form">
          <label>
            Brand
            <select id="brandFilter" name="brand">
              <option value="">All brands</option>
            </select>
          </label>

          <label>
            Body type
            <select id="bodyTypeFilter" name="bodyType">
              <option value="">All body types</option>
            </select>
          </label>

          <label>
            Fuel type
            <select id="fuelTypeFilter" name="fuelType">
              <option value="">All fuel types</option>
            </select>
          </label>

          <label>
            Min horsepower
            <input type="number" id="horsepowerMinFilter" name="horsepowerMin" min="0" placeholder="e.g. 150" />
          </label>

          <label>
            Max horsepower
            <input type="number" id="horsepowerMaxFilter" name="horsepowerMax" min="0" placeholder="e.g. 350" />
          </label>

          <label>
            Year from
            <input type="number" id="yearMinFilter" name="yearMin" min="1980" max="2030" />
          </label>

          <label>
            Year to
            <input type="number" id="yearMaxFilter" name="yearMax" min="1980" max="2030" />
          </label>

          <button type="reset" class="button secondary">Reset filters</button>
        </form>
      </section>

      <section class="catalog" aria-live="polite">
        <div class="catalog-header">
          <h2>Available catalog</h2>
          <p id="catalogCount">0 cars</p>
        </div>
        <div id="carsGrid" class="cars-grid"></div>
      </section>
    </main>

    <dialog id="carModal" class="car-modal">
      <button class="close-modal" id="closeModalBtn" aria-label="Close details">×</button>
      <div id="modalContent"></div>
    </dialog>

    <script type="module" src="/js/app.js"></script>
  </body>
</html>
